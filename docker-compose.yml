services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: task_api
      POSTGRES_DB: task_management
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_api -d task_management"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGUSER: task_api
      PGDATABASE: task_management
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
